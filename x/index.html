<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>モコ鈴蘭台店 | 株式会社西宮モコ</title>
    <!-- X（@mokosuzurandai）のプロフィールに載せる短い入口（2026-10-16）。
         X の URL 欄は100文字までのため、ここから目印（UTM）付きの鈴蘭台店ページへ転送する。
         転送先や目印を変えるときは、このファイルの URL（3か所）だけを直す。
         アクセス解析（GA4）はこのページでは計測せず、転送先のページで計測する -->
    <meta http-equiv="refresh" content="0; url=/stores/suzurandai/?utm_source=x&utm_medium=social&utm_campaign=x_profile">
    <script>location.replace('/stores/suzurandai/?utm_source=x&utm_medium=social&utm_campaign=x_profile');</script>
    <style>
        body { margin: 0; padding: 60px 20px; font-family: 'Noto Sans JP', sans-serif; text-align: center; color: #1c2a22; background: #ffffff; }
        a { color: #0b3b24; font-weight: 700; }
    </style>
</head>

<body>
    <p>モコ鈴蘭台店のページへ移動しています…</p>
    <p><a href="/stores/suzurandai/?utm_source=x&utm_medium=social&utm_campaign=x_profile">移動しない場合はこちら</a></p>
</body>

</html>
